version: 2
updates:
  # Versions are centralised in Directory.Packages.props, so every bump lands in one file.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: 'deps'
    groups:
      microsoft-extensions:
        patterns: ['Microsoft.Extensions.*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
    commit-message:
      prefix: 'ci'
