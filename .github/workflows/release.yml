name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 2.0.0)'
        required: true
        type: string

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            installer_platform: x64
          - rid: win-arm64
            installer_platform: arm64
          - rid: win-x86
            installer_platform: x86

    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Resolve the version
        id: version
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
              '${{ inputs.version }}'
          } else {
              '${{ github.ref_name }}' -replace '^v', ''
          }
          if ($version -notmatch '^\d+\.\d+\.\d+') { throw "'$version' is not a version number" }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Output "Building $version"

      - name: Test
        # A tag should never ship something the test suite rejects, even if CI already ran.
        run: dotnet test BatchRenamePro.sln -c Release

      - name: Publish
        # Self-contained, single-file and compressed come from the project file.
        run: >
          dotnet publish src/BatchRenamePro.App/BatchRenamePro.App.csproj
          -c Release -r ${{ matrix.rid }}
          -p:Version=${{ steps.version.outputs.version }}
          -o publish/${{ matrix.rid }}
        env:
          CI: true

      - name: Package
        shell: pwsh
        run: |
          $rid = '${{ matrix.rid }}'
          $staging = "staging/$rid"
          New-Item -ItemType Directory -Force $staging | Out-Null

          # Ship the executable and the documents someone needs offline — nothing else. The
          # single-file publish leaves debug symbols beside the exe; those belong in the
          # symbol artifact, not in a user's download.
          Copy-Item "publish/$rid/BatchRenamePro.exe" $staging
          Copy-Item LICENSE, README.md, README.zh-CN.md, CHANGELOG.md $staging

          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$staging/*" -DestinationPath "dist/BatchRenamePro-$rid.zip"

      - name: Build MSI installer
        run: >
          dotnet build installer/BatchRenamePro.Installer/BatchRenamePro.Installer.wixproj
          -c Release
          -p:RuntimeIdentifier=${{ matrix.rid }}
          -p:InstallerPlatform=${{ matrix.installer_platform }}
          -p:ProductVersion=${{ steps.version.outputs.version }}
          -p:PublishDir="${{ github.workspace }}\publish\${{ matrix.rid }}"

      - name: Collect MSI installer
        shell: pwsh
        run: |
          $rid = '${{ matrix.rid }}'
          $msi = "installer/BatchRenamePro.Installer/bin/Release/$rid/BatchRenamePro-$rid.msi"
          if (-not (Test-Path $msi)) { throw "$msi was not produced" }
          Copy-Item $msi dist

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.rid }}
          path: dist/*
          retention-days: 7

  release:
    name: Publish the release
    runs-on: ubuntu-latest
    needs: build
    # A manual run builds and uploads the artifacts so the pipeline can be exercised without
    # cutting a release. Only a tag actually publishes one.
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum *.msi *.zip | tee SHA256SUMS.txt

      - name: Release notes
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes_file=".github/release-notes/v${version}.md"
          if [ -f "$notes_file" ]; then
            notes=$(cat "$notes_file")
          else
            # Lift this version's section out of the changelog: everything between its heading
            # and the next one. Falls back to a link if the section is missing.
            notes=$(awk -v v="$version" '
              $0 ~ "^## \\[" v "\\]" { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md)
          fi

          if [ -z "$(echo "$notes" | tr -d '[:space:]')" ]; then
            notes="See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)."
          fi

          {
            echo 'notes<<RELEASE_NOTES_EOF'
            echo "$notes"
            echo
            echo '---'
            echo
            echo '### Downloads'
            echo
            echo '| File | For |'
            echo '|---|---|'
            echo '| `BatchRenamePro-win-x64.msi` | Almost every PC and laptop; recommended |'
            echo '| `BatchRenamePro-win-arm64.msi` | Snapdragon / ARM64 devices; recommended |'
            echo '| `BatchRenamePro-win-x86.msi` | 32-bit Windows; recommended |'
            echo '| `BatchRenamePro-win-*.zip` | Portable build for the matching architecture |'
            echo
            echo 'The MSI installers and portable ZIPs are self-contained — no .NET install needed.'
            echo 'Verify your download against `SHA256SUMS.txt`:'
            echo
            echo '```powershell'
            echo 'Get-FileHash .\BatchRenamePro-win-x64.msi -Algorithm SHA256'
            echo '```'
            echo
            echo 'The executables are not code-signed, so SmartScreen may warn on first run.'
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create the release
        uses: softprops/action-gh-release@v3
        with:
          name: Batch Rename Pro ${{ github.ref_name }}
          files: |
            dist/*.msi
            dist/*.zip
            dist/SHA256SUMS.txt
          body: ${{ steps.notes.outputs.notes }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          generate_release_notes: false
