name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push supersedes the run in flight for the same branch or pull request.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build and test
    # WPF needs Windows, so there is no point running the Core tests anywhere else.
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore BatchRenamePro.sln

      - name: Generate WPF design-time sources
        # dotnet format loads the Debug design-time build. Generate its XAML sources first so
        # InitializeComponent and named controls are available to Roslyn on a clean runner.
        run: dotnet build BatchRenamePro.sln -c Debug --no-restore

      - name: Check formatting
        run: dotnet format BatchRenamePro.sln --verify-no-changes --no-restore

      - name: Build
        # Warnings are errors and analysis runs at latest-recommended, so this is the real gate.
        run: dotnet build BatchRenamePro.sln -c Release --no-restore

      - name: Test
        run: >
          dotnet test BatchRenamePro.sln -c Release --no-build
          --logger "trx;LogFileName=results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**
          retention-days: 14

  publish-check:
    name: Publish check (${{ matrix.rid }})
    # Proves the self-contained single-file publish still works on every runtime we ship,
    # which plain `dotnet build` does not exercise.
    runs-on: windows-latest
    needs: build
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            installer_platform: x64
          - rid: win-arm64
            installer_platform: arm64
          - rid: win-x86
            installer_platform: x86

    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ matrix.rid }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj', '**/*.wixproj') }}
          restore-keys: nuget-${{ runner.os }}-${{ matrix.rid }}-

      - name: Publish
        # Self-contained, single-file and compressed come from the project file, so naming the
        # runtime is the whole command and CI cannot drift from what a contributor runs locally.
        run: >
          dotnet publish src/BatchRenamePro.App/BatchRenamePro.App.csproj
          -c Release -r ${{ matrix.rid }} -o publish/${{ matrix.rid }}

      - name: Verify the executable was produced
        shell: pwsh
        run: |
          $exe = "publish/${{ matrix.rid }}/BatchRenamePro.exe"
          if (-not (Test-Path $exe)) { throw "$exe was not produced" }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Output "${{ matrix.rid }}: BatchRenamePro.exe is $mb MB"

      - name: Build MSI installer
        run: >
          dotnet build installer/BatchRenamePro.Installer/BatchRenamePro.Installer.wixproj
          -c Release
          -p:RuntimeIdentifier=${{ matrix.rid }}
          -p:InstallerPlatform=${{ matrix.installer_platform }}
          -p:PublishDir="${{ github.workspace }}\publish\${{ matrix.rid }}"

      - name: Verify the MSI was produced
        shell: pwsh
        run: |
          $msi = "installer/BatchRenamePro.Installer/bin/Release/${{ matrix.rid }}/BatchRenamePro-${{ matrix.rid }}.msi"
          if (-not (Test-Path $msi)) { throw "$msi was not produced" }
          $mb = [math]::Round((Get-Item $msi).Length / 1MB, 1)
          Write-Output "${{ matrix.rid }}: BatchRenamePro-${{ matrix.rid }}.msi is $mb MB"

      - name: Verify the MSI contract
        shell: pwsh
        run: |
          [xml] $props = Get-Content Directory.Build.props
          $version = ($props.Project.PropertyGroup.VersionPrefix | Where-Object { $_ } | Select-Object -First 1)
          ./tools/test-msi-package.ps1 `
            -MsiPath installer/BatchRenamePro.Installer/bin/Release/${{ matrix.rid }}/BatchRenamePro-${{ matrix.rid }}.msi `
            -ExpectedVersion $version
